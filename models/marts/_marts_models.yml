version: 2

models:
  - name: int_actual_omzet_maand
    description: "Actuele intake omzet per klant/jaar/maand, uit verkooporder + verkooporderregel."
  - name: rpt_intake_omzet_vs_budget
    description: >
      Vergelijking van actuele intake omzet tegen Budget en Latest Estimate,
      per klant/jaar/maand - het centrale rapportmodel voor de klantdemo.
    columns:
      - name: klant_id
        tests: [not_null]
  - name: rpt_top_klanten
    description: "Klanten gerangschikt op totale actuele omzet, met concern/vestiging/accountmanager."
    columns:
      - name: klant_id
        tests: [unique, not_null]
  - name: rpt_omzet_per_klantartikelgroep
    description: "Actuele omzet per klantartikelgroep en jaar - welke productcategorieën presteren."
  - name: rpt_omzet_per_vestiging
    description: "Actuele omzet per vestiging en jaar - regionaal beeld."
