version: 2

sources:
  - name: raw
    description: >
      Landingszone-tabellen in de Lakehouse "Landing_bron_data" (dev-workspace).
      dbt verbindt met het Warehouse "dbt_raw" en leest deze tabellen via
      Fabric's cross-database querying (workspace-niveau) rechtstreeks uit de
      Lakehouse - geen shortcuts of kopie nodig. Zie orchestration/README.md.
    database: Landing_bron_data
    schema: dbo
    tables:
      - name: klant
      - name: concern
      - name: vestiging
      - name: medewerker
      - name: secuser
      - name: klantartikel
      - name: klantartikelgroep
      - name: etiket
      - name: formaatgroep
      - name: droogtechniek
      - name: artikelpapier
      - name: tussensnee
      - name: bewerkingscenario
      - name: bewerkingscenariogroep
      - name: verkooporder
      - name: verkooporderregel
      - name: budget_intake
      - name: budgetbucket
      - name: d_datum
