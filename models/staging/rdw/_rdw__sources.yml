version: 2

sources:
  - name: rdw
    description: >
      Ruwe RDW voertuigdata (Rijksdienst voor het Wegverkeer), aangeleverd via
      rdw_data.csv ("Gekentekende voertuigen" open dataset). Het CSV-bestand
      staat lokaal in raw_data/ en moet apart (buiten dbt om, bv. via een
      Fabric-pipeline of dataflow) geladen worden naar deze schema/tabel,
      omdat het bestand te groot is voor een dbt seed.
    schema: raw
    tables:
      - name: rdw_data
        description: "Kenteken-niveau voertuiggegevens, één rij per kenteken."
        columns:
          - name: __id
            description: "Uniek record-id uit de RDW open data bron."
          - name: kenteken
            description: "Kenteken van het voertuig."
          - name: merk
            description: "Merk van het voertuig."
